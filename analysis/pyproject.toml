[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funnel"
version = "0.0.1"
description = "Ingest, structural profiling, export, and agent evaluation for the e-commerce funnel analytics project"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["funnel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
