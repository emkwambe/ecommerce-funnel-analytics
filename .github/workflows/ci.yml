# CI: gates that run independently of the local agent (trio-sprint-workflow, Governed tier).
# No raw data, Parquet, warehouse, or dbt build runs here: the event log is not in the repo and is too
# large for CI. pytest runs on the committed JSON exports, committed evidence, and synthetic fixtures.
# Action versions were checked against each action's latest release on 2026-09-26.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # manifests and the workflow export read git history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: python -m pip install -r analysis/requirements.txt
      - run: python -m pip install -e analysis
      - run: python -m pytest analysis/tests -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22" # local builds use Node 22 (ai-workflow/tools.md)
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run build --prefix web

  docs-checks:
    # Documentation drift checks (trio documentation playbook §3). Env drift, metrics-page drift,
    # naming rules, and the no-row-level-data guard run inside pytest (python-tests job).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Link check (README, CHANGELOG, docs)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md CHANGELOG.md docs
          fail: true
