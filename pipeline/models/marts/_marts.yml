version: 2

models:
  - name: mart_kpis_daily
    description: >
      Section 4 (orders, revenue, AOV, revenue per session) and Section 6 (session funnel) metrics
      over valid sessions, one row per UTC day of session start and one row for the month.
      Each session, its order, and its revenue count on the UTC day of the session's first event
      (Section 9, Time).
    columns:
      - name: period_key
        description: period_type and period_start (grain key).
        data_tests: [unique, not_null]
      - name: period_type
        description: "'day' or 'month'."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["day", "month"]
      - name: period_start
        description: UTC day of session start, or the first day of the month for the month row.
        data_tests: [not_null]
      - name: period_label
        description: Display label; always names the UTC day of session start (Section 1 rule 5; Section 9).
      - name: sessions
        description: Valid sessions (Section 6, Sessions).
      - name: sessions_with_view
        description: Valid sessions with at least one view event (Section 6, "Sessions with an observed view").
      - name: sessions_with_cart
        description: Valid sessions with at least one cart event (Section 6, "Sessions with an observed cart event").
      - name: sessions_with_purchase
        description: Valid sessions with at least one purchase event (Section 6, "Sessions with an observed purchase").
      - name: orders
        description: Sessions with an observed purchase; one order per such session (Section 4, D4).
      - name: viewing_sessions_with_cart
        description: Sessions with a view and at least one cart event; numerator of the view-to-cart session rate (Section 6).
      - name: cart_sessions_with_carted_product_purchase
        description: >
          Sessions with at least one cart event and at least one purchase of a product that has a
          cart event in that session; numerator of the cart-session purchase rate (Section 6).
      - name: cart_sessions_with_no_observed_purchase
        description: >
          Sessions with at least one cart event and no purchase event of any product (Section 6,
          "Sessions with an observed cart event and no observed purchase in this session").
      - name: sessions_with_purchase_of_carted_product
        description: >
          "Sessions with an observed purchase of a product with an observed same-session cart event": at
          least one purchase event on that Section 5 path (Changes 2026-09-26, third entry, item 1). Equals
          cart_sessions_with_carted_product_purchase (assert_session_purchase_paths_partition).
      - name: sessions_with_purchases_only_of_uncarted_products
        description: >
          "Sessions with observed purchases only of products with no observed same-session cart event": every
          purchase event on that Section 5 path (Changes 2026-09-26, third entry, item 1). With the previous
          column, sums to sessions_with_purchase.
      - name: cart_sessions_with_purchase_of_no_carted_product
        description: >
          "Sessions with an observed cart event and an observed purchase, none of a carted product" (Changes
          2026-09-26, third entry, item 2). With cart_sessions_with_carted_product_purchase and
          cart_sessions_with_no_observed_purchase, sums to sessions_with_cart (assert_cart_sessions_partition).
      - name: revenue
        description: Sum of price over deduplicated purchase events in valid sessions (Section 4, primary).
      - name: revenue_repeat_collapsed
        description: >
          Sum over (session, product) purchase pairs of the earliest purchase event's price
          (Section 4, secondary). Always shown with revenue where the difference is discussed.
      - name: session_purchase_rate
        description: sessions_with_purchase / sessions (Section 6, "Sessions with an observed purchase (%)").
      - name: view_to_cart_session_rate
        description: viewing_sessions_with_cart / sessions_with_view (Section 6, "Viewing sessions with an observed cart event (%)").
      - name: cart_session_purchase_rate
        description: >
          cart_sessions_with_carted_product_purchase / sessions_with_cart (Section 6, "Sessions with
          an observed cart event and an observed purchase of a carted product (%)").
      - name: average_order_value
        description: revenue / orders (Section 4).
      - name: revenue_per_session
        description: revenue / sessions (Section 4).

  - name: mart_purchase_paths
    description: >
      Section 5 metrics per purchase path: purchase event counts, revenue, and revenue share.
      Totals include both paths.
    columns:
      - name: purchase_path
        description: Section 5 path label (grain key).
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Purchase with an observed same-session cart event"
                  - "Purchase with no observed same-session cart event"
      - name: purchase_events
        description: Deduplicated purchase events in valid sessions on this path.
      - name: revenue
        description: Sum of purchase price on this path (Section 4, primary revenue).
      - name: revenue_share
        description: This path's revenue / total revenue (Section 5).

  - name: mart_funnel_category
    description: >
      Section 9 category funnel (with Changes 2026-09-26, both entries) and Section 7 carted value,
      one row per category at two levels: category_top (headline) and category_code (drill-down,
      full code). Funnel counts use (valid session, category) pairs entered by a view in the
      category; one session can enter several category funnels, so counts do not sum to session
      totals. Events, purchase events, and revenue cover all events in the category in valid
      sessions, so they sum to the totals. Carted pairs and carted value are grouped by the category
      on each pair's latest cart event, with no view requirement. Both population differences are
      disclosed on the funnel page. Unknown is an explicit level.
    columns:
      - name: category_key
        description: category_level and category (grain key).
        data_tests: [unique, not_null]
      - name: category_level
        description: "'category_top' or 'category_code'."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["category_top", "category_code"]
      - name: category
        description: Top-level category or full code; "unknown" when missing (Section 9).
        data_tests: [not_null]
      - name: events
        description: Deduplicated events in the category in valid sessions; basis of the unknown share of events.
      - name: funnel_pairs
        description: (session, category) pairs with at least one view in the category; the funnel entry step.
      - name: funnel_pairs_with_cart
        description: Funnel pairs with at least one cart event in the category.
      - name: funnel_pairs_with_purchase
        description: Funnel pairs with at least one purchase event in the category.
      - name: funnel_cart_pairs_with_carted_product_purchase
        description: >
          Funnel pairs with a cart event in the category and a purchase of a product in the category
          that has a cart event anywhere in the same session; numerator of the cart-to-purchase rate.
      - name: funnel_pairs_with_carted_product_purchase_but_no_category_cart
        description: >
          Funnel pairs with a purchase of a carted product in the category but no cart event in the
          category. Must be zero for the rate to stay within 100% (assert_category_cart_to_purchase_within_cart_step).
      - name: purchase_events
        description: Purchase events in the category in valid sessions.
      - name: revenue
        description: Category revenue, the sum of purchase price over all purchase events in the category (Changes 2026-09-26).
      - name: carted_pairs
        description: Carted (session, product) pairs whose latest cart event is in this category (Section 7).
      - name: carted_pairs_with_purchase
        description: Carted pairs with a purchase event of that product in the session.
      - name: carted_pairs_with_no_observed_purchase
        description: Carted pairs with no purchase event of that product in the session.
      - name: zero_price_carted_pairs
        description: Carted pairs whose cart events are all zero-price; in pair counts, not in value (Section 7).
      - name: carted_value_with_no_observed_purchase
        description: >
          Sum of latest non-zero cart price over carted pairs with no observed purchase in this session
          (Section 7). Displayed as "carted value with no observed purchase in this session".
      - name: view_to_cart_step_rate
        description: funnel_pairs_with_cart / funnel_pairs (Changes 2026-09-26, item 2).
      - name: cart_to_purchase_step_rate
        description: >
          funnel_cart_pairs_with_carted_product_purchase / funnel_pairs_with_cart (Changes 2026-09-26,
          second entry, item 1).

  - name: mart_data_quality
    description: >
      Section 10 data-quality metrics (with Changes 2026-09-26, item 1), each with its basis and the
      Sprint 0 raw-basis figure alongside where Sprint 0 published one (read from the committed
      profile.json), plus the Section 3 long-session sensitivity for the five headline metrics.
    columns:
      - name: metric_key
        description: Metric identifier (grain key).
        data_tests: [unique, not_null]
      - name: metric_group
        description: "'data_quality' or 'long_session_sensitivity'."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["data_quality", "long_session_sensitivity"]
      - name: metric_label
        description: Display label.
        data_tests: [not_null]
      - name: basis
        description: >
          'raw rows' (exact duplicates only), 'deduplicated events before session exclusions'
          (null-session events, multi-user sessions), or 'deduplicated events in valid sessions'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "raw rows"
                  - "deduplicated events before session exclusions"
                  - "deduplicated events in valid sessions"
      - name: value
        description: The metric on its stated basis; for sensitivity rows, the value over all valid sessions.
        data_tests: [not_null]
      - name: value_excluding_long_sessions
        description: Sensitivity rows only, the value with sessions longer than 24 hours excluded (Section 3).
      - name: sprint0_raw_basis_value
        description: The Sprint 0 figure for the same check on raw rows, where one exists; shown alongside, never substituted.
      - name: sort_order
        description: Display order.
  - name: mart_revenue_gap_decomposition
    description: >
      metrics.md Changes 2026-09-26 (Sprint 2 investigations), A items 2 and 3. The difference between revenue
      (primary) and revenue with repeat purchase events collapsed, broken down over the repeat purchase events by
      five dimensions, plus a 'total' row. Each dimension's groups sum exactly to the difference
      (assert_revenue_gap_decomposition_reconciles).
    columns:
      - name: row_key
        description: dimension and group_key (grain key).
        data_tests: [unique, not_null]
      - name: dimension
        description: The breakdown dimension, or 'total'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["total", "time_since_previous_purchase", "price_vs_first_purchase", "category_top",
                         "purchase_events_in_pair", "time_by_price"]
      - name: group_key
        description: The group within the dimension.
        data_tests: [not_null]
      - name: group_label
        description: Display label from the Changes entry (category groups use the category name).
        data_tests: [not_null]
      - name: sort_order
        description: Display order; null for categories, which the export orders by value.
      - name: repeat_purchase_events
        description: Repeat purchase events in the group (A item 1).
        data_tests: [not_null]
      - name: pairs
        description: (session, product) pairs with a repeat purchase event in the group; not additive across groups.
        data_tests: [not_null]
      - name: repeat_purchase_value
        description: Price sum (DECIMAL) of the group's repeat purchase events.
        data_tests: [not_null]
      - name: share_of_difference
        description: repeat_purchase_value ÷ revenue_difference.
        data_tests: [not_null]
      - name: top_10_pair_share
        description: Concentration diagnostic (A item 3), the share of the group's value from its 10 largest pairs.
      - name: revenue
        description: Revenue (primary) for the month, from mart_kpis_daily (Section 4).
      - name: revenue_repeat_collapsed
        description: Revenue with repeat purchase events collapsed, from mart_kpis_daily (Section 4).
      - name: revenue_difference
        description: revenue − revenue_repeat_collapsed (A item 2).
  - name: mart_revenue_gap_thresholds
    description: >
      metrics.md Changes 2026-09-26 (Sprint 2 investigations), A item 4. Threshold sensitivity, the share of the
      revenue difference from repeat purchase events within T of the pair's previous purchase event, for the nine
      thresholds fixed in the entry.
    columns:
      - name: threshold_seconds
        description: T in seconds (grain key).
        data_tests: [unique, not_null]
      - name: threshold_label
        description: T as written in the Changes entry.
        data_tests: [not_null]
      - name: repeat_purchase_events_within
        description: Repeat purchase events with seconds_since_previous_purchase ≤ T.
        data_tests: [not_null]
      - name: repeat_purchase_value_within
        description: Their price sum (DECIMAL).
        data_tests: [not_null]
      - name: share_of_difference
        description: repeat_purchase_value_within ÷ revenue_difference.
        data_tests: [not_null]
      - name: repeat_purchase_events
        description: All repeat purchase events (denominator count).
      - name: revenue_difference
        description: The revenue difference (denominator value).
  - name: mart_duplicate_rows_breakdown
    description: >
      metrics.md Changes 2026-09-26 (Sprint 2 investigations), A item 5 (secondary case A-S1). Exact duplicate rows
      removed by D1, by event type and group size, counted on raw rows. Sums to stg_dedup_audit
      (assert_duplicate_rows_breakdown_reconciles).
    columns:
      - name: row_key
        description: event_type and group_size (grain key).
        data_tests: [unique, not_null]
      - name: event_type
        description: Event type of the identical rows.
        data_tests: [not_null]
      - name: group_size
        description: Rows in the group of identical rows.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["2", "3", "4_or_more"]
      - name: group_size_label
        description: Display label ("2", "3", "4 or more").
      - name: duplicate_groups
        description: Groups of identical rows.
        data_tests: [not_null]
      - name: rows_removed
        description: Surplus rows removed (group rows − 1, summed).
        data_tests: [not_null]
  - name: mart_cart_no_view_reconciliation
    description: >
      metrics.md Changes 2026-09-26 (Sprint 2 investigations), A item 6 (secondary case A-S2). From the Sprint 0
      raw-basis count of cart events with no view at or before them to the Section 10 count, attributed in the
      entry's order. The remainder must be zero (assert_cart_no_view_reconciliation).
    columns:
      - name: row_key
        description: A single row (grain key).
        data_tests: [unique, not_null]
      - name: sprint0_raw_basis_count
        description: The Sprint 0 figure, read from the committed profile.json.
        data_tests: [not_null]
      - name: raw_basis_count
        description: The raw-basis count recomputed here as funnel.profile defined it; must equal the Sprint 0 figure.
        data_tests: [not_null]
      - name: in_null_session_events
        description: Part (i), raw-basis rows with a null session; zero by the basis's definition, computed.
        data_tests: [not_null]
      - name: in_multi_user_sessions
        description: Part (i), raw-basis rows in sessions with more than one user_id.
        data_tests: [not_null]
      - name: removed_as_exact_duplicates
        description: Part (ii), of the rest, rows removed as exact duplicates by D1.
        data_tests: [not_null]
      - name: contract_basis_count
        description: The Section 10 count, from mart_data_quality.
        data_tests: [not_null]
      - name: difference
        description: raw_basis_count − contract_basis_count.
        data_tests: [not_null]
      - name: remainder
        description: Part (iii); must be zero.
        data_tests: [not_null]
  - name: mart_later_purchase_estimates
    description: >
      metrics.md Changes 2026-09-26 (Sprint 2 investigations), B items 9-11, 13, 14. Point estimates per
      specification, with the counts and value sums behind every share (H3-D2). Intervals come from
      funnel.later_purchases (user-level cluster bootstrap, H3-D5).
    columns:
      - name: spec_key
        description: B1 (primary), B2, B3 (windows), B5 (comparison baseline), B6-B8 (sensitivities) (grain key).
        data_tests: [unique, not_null]
      - name: pair_type
        description: "'carted' or 'viewed'."
      - name: window_days
        description: N.
      - name: cutoff
        description: Latest session start included.
      - name: eligible_pairs
        description: Eligible pairs (denominator of the count share).
        data_tests: [not_null]
      - name: followed_pairs
        description: Followed eligible pairs (numerator of the count share).
        data_tests: [not_null]
      - name: count_share
        description: followed_pairs ÷ eligible_pairs (item 9).
        data_tests: [not_null]
      - name: eligible_pairs_with_value
        description: Eligible pairs with a non-null value (value share population).
      - name: eligible_value
        description: Value of eligible pairs (denominator of the value share).
      - name: followed_value
        description: Value of followed eligible pairs (numerator of the value share).
      - name: value_share
        description: followed_value ÷ eligible_value (item 10).
      - name: users
        description: Distinct users with an eligible pair (the bootstrap's resampling units).
  - name: mart_later_purchase_user_sums
    description: >
      Changes 2026-09-26 (Sprint 2 investigations), common rules: per (specification, user_id), the sums the
      user-level cluster bootstrap resamples. Not exported.
    columns:
      - name: row_key
        description: spec_key and user_id (grain key).
        data_tests: [unique, not_null]
      - name: spec_key
        description: Specification.
        data_tests: [not_null]
      - name: user_id
        description: Resampling unit.
      - name: eligible_pairs
        description: The user's eligible pairs.
      - name: followed_pairs
        description: The user's followed pairs.
      - name: eligible_value
        description: The user's eligible value.
      - name: followed_value
        description: The user's followed value.
  - name: mart_later_purchase_km_pairs
    description: >
      Changes 2026-09-26 (Sprint 2 investigations), B item 12. Every carted pair with no purchase in the session
      (no cutoff): time from session start to the first later purchase, or censoring at 2019-10-31 23:59:59 UTC,
      with the cohort for the diagnostic of owner decision B-D6. Not exported.
    columns:
      - name: pair_key
        description: The carted pair (grain key).
        data_tests: [unique, not_null]
      - name: user_id
        description: Resampling unit.
      - name: session_start
        description: Time origin.
        data_tests: [not_null]
      - name: value
        description: Weight for the value-weighted estimate; null pairs weigh zero.
      - name: is_event
        description: A later purchase exists (conditions 1-3).
        data_tests: [not_null]
      - name: duration_seconds
        description: Seconds to the first later purchase, or to the censoring time.
        data_tests: [not_null]
      - name: cohort
        description: Session start by the 7-day cutoff, or after it.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["by_7_day_cutoff", "after_7_day_cutoff"]
  - name: mart_later_purchase_checks
    description: >
      Changes 2026-09-26 (Sprint 2 investigations), B items 14-16. The most-active-user threshold, the user_id
      checks, and the diagnostics published beside the estimate (not findings).
    columns:
      - name: row_key
        description: metric_group and metric_key (grain key).
        data_tests: [unique, not_null]
      - name: metric_group
        description: user_id_check, sensitivity_threshold, or diagnostic.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["user_id_check", "sensitivity_threshold", "diagnostic"]
      - name: metric_key
        description: The check or diagnostic.
        data_tests: [not_null]
      - name: value
        description: Its value.
      - name: sort_order
        description: Display order.