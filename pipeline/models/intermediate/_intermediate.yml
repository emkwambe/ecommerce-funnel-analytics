version: 2

models:
  - name: int_sessions
    description: >
      One row per valid session (metrics.md Section 3): user_session as logged, excluding
      null-session events and sessions with more than one user_id. Sessions longer than
      24 hours are kept and flagged for the sensitivity check.
    columns:
      - name: user_session
        description: Session identifier (grain key).
        data_tests: [unique, not_null]
      - name: user_id
        description: The session's single user_id.
      - name: session_start
        description: Timestamp of the session's first event, UTC.
        data_tests: [not_null]
      - name: session_end
        description: Timestamp of the session's last event, UTC.
        data_tests: [not_null]
      - name: session_start_day_utc
        description: >
          UTC day of the session's first event. Daily KPIs assign each session, its order, and
          its revenue to this day, labeled "UTC day of session start" (Section 9, Time).
        data_tests: [not_null]
      - name: has_view
        description: At least one view event (Section 6, Sessions with an observed view).
        data_tests: [not_null]
      - name: has_cart
        description: At least one cart event (Section 6, Sessions with an observed cart event).
        data_tests: [not_null]
      - name: has_purchase
        description: At least one purchase event; such a session is one order (Section 4, D4).
        data_tests: [not_null]
      - name: is_long_session
        description: Last event more than 24 hours after the first (Section 3; kept, sensitivity check).
        data_tests: [not_null]
      - name: event_count
        description: Deduplicated events in the session.
        data_tests: [not_null]
      - name: view_event_count
        description: View events in the session.
      - name: cart_event_count
        description: Cart events in the session (observed cart events, Section 7).
      - name: purchase_event_count
        description: Purchase events in the session.

  - name: int_session_products
    description: >
      One row per (valid session, product) pair with at least one event (Sections 4 and 7).
      Carted value, zero-price carted pairs, and the carted-value category are defined at this
      grain. Tie tests fail the build if a latest or earliest value is ambiguous.
    data_tests:
      - unique:
          arguments:
            column_name: "user_session || '|' || product_id"
    columns:
      - name: user_session
        description: Session identifier (grain key, with product_id).
        data_tests: [not_null]
      - name: product_id
        description: Product identifier (grain key, with user_session).
        data_tests: [not_null]
      - name: has_view
        description: The product has a view event in the session.
      - name: is_carted
        description: The product has a cart event in the session (a carted pair, Section 7).
        data_tests: [not_null]
      - name: is_purchased
        description: The product has a purchase event in the session.
        data_tests: [not_null]
      - name: cart_event_count
        description: Cart events of the pair.
      - name: purchase_event_count
        description: Purchase events of the pair; more than one may be extra units or repeated logging (Section 4).
      - name: latest_cart_time
        description: Timestamp of the pair's latest cart event.
      - name: latest_cart_price
        description: Price on the pair's latest cart event, zero included (reference only; not a value metric).
      - name: latest_nonzero_cart_price
        description: >
          Price on the latest cart event of the pair whose price is above zero: the pair's carted
          value (Section 7). Null for zero-price carted pairs.
      - name: is_zero_price_carted_pair
        description: >
          Carted pair whose cart events are all zero-price. Counted in pair counts, excluded from
          value; the count is a data-quality metric (Sections 7 and 10).
        data_tests: [not_null]
      - name: latest_cart_category_top
        description: Top-level category on the pair's latest cart event; groups carted value (Section 7).
      - name: latest_cart_category_code_label
        description: Full category code on the pair's latest cart event, for drill-downs (Sections 7 and 9).
      - name: earliest_purchase_price
        description: Price on the pair's earliest purchase event; summed for secondary revenue (Section 4).

  - name: int_session_facts
    description: >
      One row per valid session with the flags and values that Section 4 and Section 6 metrics
      aggregate. mart_kpis_daily and the long-session sensitivity in mart_data_quality both read
      it, so they share one definition.
    columns:
      - name: user_session
        description: Session identifier (grain key).
        data_tests: [unique, not_null]
      - name: session_start_day_utc
        description: UTC day of session start (Section 9, Time).
        data_tests: [not_null]
      - name: is_long_session
        description: Longer than 24 hours (Section 3, sensitivity check).
        data_tests: [not_null]
      - name: has_view
        description: At least one view event.
      - name: has_cart
        description: At least one cart event.
      - name: has_purchase
        description: At least one purchase event (an order, Section 4).
      - name: has_purchase_of_carted_product
        description: >
          A purchase of a product that has a cart event anywhere in the same session (Section 6;
          Changes 2026-09-26, item 3).
        data_tests: [not_null]
      - name: revenue
        description: Sum of purchase price in the session (Section 4, primary).
        data_tests: [not_null]
      - name: revenue_repeat_collapsed
        description: Sum of earliest purchase price per purchased pair in the session (Section 4, secondary).
        data_tests: [not_null]

  - name: int_purchases
    description: >
      One row per deduplicated purchase event in a valid session, with its purchase path
      (Sections 4 and 5).
    columns:
      - name: event_id
        description: Deduplicated event key from stg_events (grain key).
        data_tests: [unique, not_null]
      - name: user_session
        description: Session identifier.
        data_tests: [not_null]
      - name: product_id
        description: Product identifier.
        data_tests: [not_null]
      - name: event_time
        description: Purchase timestamp, UTC.
      - name: session_start_day_utc
        description: UTC day of session start, for daily revenue (Section 9, Time).
        data_tests: [not_null]
      - name: price
        description: Purchase price; revenue is the sum of these (Section 4, primary).
        data_tests: [not_null]
      - name: category_top
        description: Top-level category on the purchase event, or "unknown".
      - name: category_code_label
        description: Full category code on the purchase event, or "unknown".
      - name: brand_label
        description: Brand on the purchase event, or "unknown".
      - name: purchase_path
        description: Section 5 path label, by whether the product has a cart event anywhere in the same session.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Purchase with an observed same-session cart event"
                  - "Purchase with no observed same-session cart event"
  - name: int_repeat_purchase_events
    description: >
      metrics.md Changes 2026-09-26 (Sprint 2 investigations), A items 1 and 3. One row per repeat purchase
      event: every purchase event of a (valid session, product) pair except one at the pair's earliest
      purchase timestamp. Their price sum is the difference between revenue (primary) and revenue with
      repeat purchase events collapsed (Section 4).
    columns:
      - name: event_id
        description: Deduplicated purchase event (grain key).
        data_tests: [unique, not_null]
      - name: user_session
        description: Session identifier.
        data_tests: [not_null]
      - name: product_id
        description: Product identifier.
        data_tests: [not_null]
      - name: event_time
        description: Purchase timestamp, UTC.
        data_tests: [not_null]
      - name: price
        description: Purchase price (DECIMAL); summed into the revenue difference.
        data_tests: [not_null]
      - name: category_top
        description: Top-level category on the repeat purchase event, or "unknown" (A item 3).
        data_tests: [not_null]
      - name: purchase_events_in_pair
        description: Purchase events of the (session, product) pair, at least 2.
        data_tests: [not_null]
      - name: first_purchase_price
        description: The pair's earliest purchase price, the price the collapsed figure keeps (Section 4).
        data_tests: [not_null]
      - name: previous_purchase_time
        description: The latest other purchase event of the pair at or before this one (A item 3); ties give 0 s.
        data_tests: [not_null]
      - name: seconds_since_previous_purchase
        description: Seconds from previous_purchase_time to event_time (second resolution; no sub-second events).
        data_tests: [not_null]
      - name: time_group
        description: A item 3, time since the pair's previous purchase event.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["same_second", "under_a_minute", "a_minute_or_more"]
      - name: time_group_label
        description: Display label from the Changes entry ("Same second", "1 to 59 seconds later", "1 minute or more later").
      - name: time_group_sort
        description: Display order.
      - name: price_group
        description: A item 3, price compared with the pair's earliest purchase price (owner decision A-D1).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["same_price", "different_price"]
      - name: price_group_label
        description: Display label from the Changes entry.
      - name: price_group_sort
        description: Display order.
      - name: pair_size_group
        description: A item 3, purchase events in the pair.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["2", "3", "4_or_more"]
      - name: pair_size_group_label
        description: Display label ("2", "3", "4 or more").
      - name: pair_size_group_sort
        description: Display order.
  - name: int_later_purchase_pairs
    description: >
      metrics.md Changes 2026-09-26 (Sprint 2 investigations), B items 7, 8, 12, 13, 16. Pairs analysis B follows
      up, with no cutoff: 'carted' (carted pairs with no purchase in the session, the Section 7 population) and
      'viewed' (view, no cart, no purchase, in sessions holding a carted pair), each with its first later purchase
      under item 8 conditions 1-3 and, for the overlap diagnostic, with condition 2 dropped.
    columns:
      - name: pair_key
        description: pair_type, user_session, and product_id (grain key).
        data_tests: [unique, not_null]
      - name: pair_type
        description: "'carted' or 'viewed' (the comparison baseline, item 13)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["carted", "viewed"]
      - name: user_session
        description: The session of the cart (or view) events.
        data_tests: [not_null]
      - name: product_id
        description: Product identifier.
        data_tests: [not_null]
      - name: user_id
        description: The session's user_id (valid sessions have exactly one; Section 3).
      - name: session_start
        description: The session's first event, UTC; anchors the window and the cutoff (item 7).
        data_tests: [not_null]
      - name: is_long_session
        description: Session longer than 24 hours (Section 3); used by sensitivity B8.
      - name: anchor_time
        description: The pair's latest cart event ('carted') or latest view event ('viewed'); item 8 condition 3.
        data_tests: [not_null]
      - name: value
        description: Latest non-zero cart (or view) price (Section 7; item 13); null when there is none.
      - name: first_later_purchase_time
        description: Earliest purchase of the product by the same user_id meeting item 8 conditions 1-3; null if none.
      - name: first_purchase_time_any_session_start
        description: As first_later_purchase_time with condition 2 dropped (item 16, overlapping sessions).
  - name: int_later_purchase_spec_pairs
    description: >
      metrics.md Changes 2026-09-26 (Sprint 2 investigations), B items 7-11, 13, 14. One row per (specification,
      eligible pair) for B1-B3, B5, and B6-B8, with whether the pair is followed within the window (item 8 condition 4).
    columns:
      - name: spec_key
        description: Specification (B1 primary; B2-B3 windows; B5 baseline; B6-B8 sensitivities).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["B1", "B2", "B3", "B5", "B6", "B7", "B8"]
      - name: window_days
        description: N, the window in days.
        data_tests: [not_null]
      - name: cutoff
        description: Latest session start included (the entry's cutoff table).
        data_tests: [not_null]
      - name: pair_key
        description: The pair (from int_later_purchase_pairs); unique within a specification.
        data_tests: [not_null]
      - name: pair_type
        description: "'carted' or 'viewed'."
      - name: user_session
        description: Session of the pair.
      - name: product_id
        description: Product identifier.
      - name: user_id
        description: User of the session.
      - name: session_start
        description: Session start, UTC.
      - name: is_long_session
        description: Session longer than 24 hours.
      - name: anchor_time
        description: Latest cart (or view) event of the pair.
      - name: value
        description: Latest non-zero cart (or view) price; null excluded from value shares.
      - name: first_later_purchase_time
        description: First later purchase (conditions 1-3).
      - name: first_purchase_time_any_session_start
        description: First purchase with condition 2 dropped.
      - name: is_followed
        description: first_later_purchase_time < session_start + window_days days (item 8, condition 4).
        data_tests: [not_null]